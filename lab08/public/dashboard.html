<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Dashboard de Progreso</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { background: linear-gradient(135deg, #f0f4f8 0%, #d9e2ec 100%); min-height: 100vh; padding: 40px 20px; color: #334e68; }
        .container { max-width: 800px; margin: 0 auto; }
        .card { background: white; border-radius: 16px; padding: 30px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        h1 { color: #1e3a8a; }
        .btn-volver { background: #64748b; color: white; padding: 10px 20px; border-radius: 8px; text-decoration: none; font-weight: 600; }
        .stats { display: flex; justify-content: space-around; text-align: center; margin-bottom: 30px; }
        .stat-box h3 { font-size: 2.5rem; color: #2563eb; margin: 0; }
        .stat-box p { color: #64748b; font-size: 0.9rem; font-weight: 600; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 Mi Progreso</h1>
            <a href="perfil.html" class="btn-volver">Volver al Perfil</a>
        </div>

        <div class="card">
            <div class="stats">
                <div class="stat-box">
                    <h3 id="statTotal" style="color: #2563eb;">0</h3>
                    <p>Tareas Totales</p>
                </div>
                <div class="stat-box">
                    <h3 id="statCompletadas" style="color: #10b981;">0</h3>
                    <p>Tareas Completadas</p>
                </div>
                <div class="stat-box">
                    <h3 id="statPendientes" style="color: #f59e0b;">0</h3>
                    <p>Pendientes</p>
                </div>
            </div>
            <div style="width: 100%; max-width: 600px; margin: 0 auto;">
                <canvas id="graficoProgreso"></canvas>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        async function cargarDashboard() {
            try {
                const response = await fetch('/api/tareas/estadisticas', { credentials: 'same-origin' });
                if (!response.ok) return window.location.href = 'login.html';
                
                const data = await response.json();
                document.getElementById('statTotal').textContent = data.total;
                document.getElementById('statCompletadas').textContent = data.completadas;
                document.getElementById('statPendientes').textContent = data.total - data.completadas;

                const etiquetas = data.porDia.map(item => item.dia);
                const valores = data.porDia.map(item => item.cantidad);

                const ctx = document.getElementById('graficoProgreso').getContext('2d');
                new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: etiquetas,
                        datasets: [{
                            label: 'Tareas completadas',
                            data: valores,
                            backgroundColor: 'rgba(16, 185, 129, 0.7)', // Verde
                            borderColor: 'rgba(16, 185, 129, 1)',
                            borderWidth: 1,
                            borderRadius: 5
                        }]
                    },
                    options: {
                        responsive: true,
                        plugins: { legend: { display: false } },
                        scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } }
                    }
                });
            } catch (error) {
                console.error("Error al cargar el dashboard", error);
            }
        }
        cargarDashboard();
    </script>
</body>
</html>
